context:
  version: "3.3"

package:
  name: hstr
  version: ${{ version }}

source:
  url: https://github.com/dvorka/hstr/archive/v${{ version }}.tar.gz
  sha256: 3ed81ff74995c5984ce0dcaec7f27afe6256632a96ada809a6c41f9b46abcdf6

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - autoconf
    - automake
    - pkg-config
    - make
    - sed
  host:
    - bash-completion
    - libtool
    - readline
    - ncurses
  run:
    - bash-completion

tests:
  - script:
      - hh --help

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Bash and zsh history suggest box
  homepage: https://github.com/dvorka/hstr
  repository: https://github.com/dvorka/hstr

extra:
  recipe-maintainers:
    - danielnachun
